[workspace]
authors = ["Ashesh Vasalya <asheshvasalya@gmail.com>"]
name = "insta360_ros2_cuda_driver"
version = "1.1.0"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12" }]
conda-pypi-map = false

[activation]
scripts = ["scripts/set_ros_env.sh"]

[environments]
insta360 = { features = [] }

[dependencies]
python = "3.12.*"
compilers = "*"
cmake = "3.31.*"
pkg-config = "*"
make = "*"
nasm = "*"
colcon-common-extensions = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-camera-info-manager = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-image-view = "*"
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"
cuda-nvtx-dev = "12.8.*"

[pypi-dependencies]
numpy = "*"
pyequilib = ">=0.6.0"
torch = { version = "~=2.8.0", index = "https://download.pytorch.org/whl/cu128" }

[tasks]
ffmpeg-download = """
set -euo pipefail
rm -rf external/FFmpeg external/nv-codec-headers
git clone https://github.com/FFmpeg/nv-codec-headers.git external/nv-codec-headers
git clone https://github.com/FFmpeg/FFmpeg.git external/FFmpeg
git -C external/nv-codec-headers checkout --detach eddcea9e27f6b772057c9b3f87de2cc1737faffc
git -C external/FFmpeg checkout --detach 3a165c77dce7fac8c54f9f9aaab5447590433748
"""

ffmpeg-build = """
set -euo pipefail
cd external/nv-codec-headers
make PREFIX=$CONDA_PREFIX install

cd ../FFmpeg

./configure \
    --prefix=$CONDA_PREFIX \
    --enable-shared \
    --disable-static \
    --enable-gpl \
    --enable-nonfree \
    --enable-cuda \
    --enable-ffnvcodec \
    --enable-libnpp \
    --enable-nvenc \
    --extra-cflags=-I$CONDA_PREFIX/include \
    --extra-ldflags=-L$CONDA_PREFIX/lib

make -j$(nproc)
make install
"""

ffmpeg = { depends-on = ["ffmpeg-download", "ffmpeg-build"] }

build = "colcon build --packages-select insta360_ros2_cuda_driver --cmake-clean-cache --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CUDA_ARCHITECTURES=native -Wno-dev --symlink-install"
launch = "bash scripts/run_with_roudi.sh true true"
launch-headless = "bash scripts/run_with_roudi.sh false true"
